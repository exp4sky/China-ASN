name: Update China Asn List

on: 
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"  # 北京时间 00:00（UTC+8）触发

# 解决403权限问题的核心配置
permissions:
  contents: write
  pull-requests: read

jobs:
  build: 
    runs-on: ubuntu-latest
    timeout-minutes: 7  # 任务超时7分钟自动终止

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 避免浅克隆导致推送失败

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
          # 核心修复：移除cache: pip（因无requirements.txt/pyproject.toml）
          # 如需保留缓存，可改用下方注释的配置（无需依赖文件）
          # cache: "pip"
          # cache-dependency-path: "**/*.py"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Run Python
        run: |
          python scripts/ASN_CN.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update China Asn
          branch: main
          file_pattern: "asn_cn.conf"
          push_options: "--force-with-lease"
