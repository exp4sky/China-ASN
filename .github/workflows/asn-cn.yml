name: Update China Asn List

on:
  push:
    branches: [ main ]     # 只在 main 分支推送时触发，避免重复运行
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = 北京时间 00:00

# 解决403权限问题的核心配置
permissions:
  contents: write
  pull-requests: read

# 同分支新任务自动取消旧任务，避免同时写文件冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04        # 锁定版本，避开 ubuntu-latest 指向 26.04 的坑
    timeout-minutes: 7           # 任务超时7分钟自动终止

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # 避免浅克隆导致推送失败
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # 原 3.8 在 Ubuntu 26.04 无 x64 构建，必须升
          # 不加 cache: pip（无 requirements.txt，加了会报错）

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Run Python
        run: |
          python scripts/ASN_CN.py

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update China Asn
          branch: main
          file_pattern: "asn_cn.conf"
          commit_user_name: exp4sky
          commit_user_email: exp4sky@users.noreply.github.com
          # 已移除 push_options: --force-with-lease（易触发 stale info 导致推送失败）
